services:
  db:
    image: postgis/postgis:15-3.4
    environment: { POSTGRES_DB: safepath, POSTGRES_USER: safepath, POSTGRES_PASSWORD: safepath }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U safepath"], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: .env
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  frontend:
    build: ./frontend
    environment: { VITE_API_URL: http://localhost:8000/api/v1 }
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [backend]
